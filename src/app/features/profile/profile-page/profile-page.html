<div class="profile-container">
  @if (vm.loading()) {
    <div class="loading-state">Loading profile...</div>
  } @else if (vm.user(); as u) {

    <header class="profile-header">
      <div class="avatar-wrapper">
        @if (u.avatarUrl) {
          <img [src]="u.avatarUrl" [alt]="u.name" class="avatar-img" />
        } @else {
          <div class="avatar-placeholder">
            <svg lucideUser class="icon-lg"></svg>
          </div>
        }
        <button class="edit-avatar-btn" aria-label="Change photo">
          <svg lucideCamera class="icon-xs"></svg>
        </button>
      </div>

      <h1 class="profile-name">{{ u.name || 'Anonymous User' }}</h1>
      <p class="profile-joined">Member since 2026</p>
    </header>

    <div class="profile-grid">
      <section class="info-card">
        <h2>Contact Information</h2>

        <div class="info-row">
          <svg lucideMail class="icon-sm"></svg>
          <div class="info-content">
            <label>Email Address</label>
            <span>Linked to account</span>
          </div>
        </div>

        <div class="info-row">
          <svg lucidePhone class="icon-sm"></svg>
          <div class="info-content">
            <label>Phone Number</label>
            <span>{{ u.phoneNumber || 'Not provided' }}</span>
          </div>
        </div>
      </section>

      <section class="info-card">
        <h2>Account Settings</h2>
        <p class="text-muted">Manage your security and preferences.</p>
        <button class="btn-outline">Edit Profile</button>
      </section>
    </div>

  }
</div>
