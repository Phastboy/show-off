@if (vm.loading()) {
  <div class="state-message">Loading…</div>
} @else if (vm.user(); as u) {
  @if (!isEditing()) {
    <app-profile-view
      [user]="u"
      (editRequested)="onEditRequested()"
    />
  } @else {
    <app-profile-edit-form
      [user]="u"
      [saving]="vm.saving()"
      (saved)="onSaved($event)"
      (cancelled)="onCancelled()"
    />
  }
} @else {
  <div class="state-message">Could not load profile.</div>
}
