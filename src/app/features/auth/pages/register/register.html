<div class="auth-form">
  <header class="auth-form__header">
    <h1 class="auth-form__title">Create an account</h1>
    <p class="auth-form__subtitle">Start building your commercial presence</p>
  </header>

  <form class="auth-form__body" [formGroup]="form" (ngSubmit)="submit()">
    <app-field
      label="Full name"
      [required]="true"
      [error]="nameInvalid() ? 'Name is required (min. 2 characters)' : null"
      [attr.data-error]="nameInvalid() || null"
    >
      <input
        id="name"
        type="text"
        formControlName="name"
        placeholder="Your name"
        autocomplete="name"
      />
    </app-field>

    <app-email-password-fields [parentForm]="form" />

    @if (error()) {
      <div class="auth-form__error" role="alert">{{ error() }}</div>
    }

    <button appBtn variant="primary" class="btn--full" type="submit" [loading]="submitting()">
      {{ submitting() ? 'Creating account...' : 'Create account' }}
    </button>
  </form>

  <footer class="auth-form__footer">
    Already have an account?
    <a routerLink="../login" class="auth-form__link">Sign in</a>
  </footer>
</div>
