<div class="auth-form">
  <header class="auth-form__header">
    <h1 class="auth-form__title">Create an account</h1>
    <p class="auth-form__subtitle">Start building your commercial presence</p>
  </header>

  <form class="auth-form__body" [formGroup]="form" (ngSubmit)="submit()">

    <div class="field" [class.field--error]="form.get('name')?.invalid && form.get('name')?.touched">
      <label class="field__label" for="name">Full name</label>
      <input
        id="name"
        class="field__input"
        type="text"
        formControlName="name"
        placeholder="Your name"
        autocomplete="name"
      />
      @if (form.get('name')?.invalid && form.get('name')?.touched) {
        <span class="field__error">Name is required (min. 2 characters)</span>
      }
    </div>

    <app-email-password-fields [parentForm]="form" />

    @if (error()) {
      <div class="auth-form__error" role="alert">{{ error() }}</div>
    }

    <button class="btn btn--primary btn--full" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <span class="btn__spinner"></span>
        Creating account...
      } @else {
        Create account
      }
    </button>
  </form>

  <footer class="auth-form__footer">
    Already have an account?
    <a routerLink="../login" class="auth-form__link">Sign in</a>
  </footer>
</div>
