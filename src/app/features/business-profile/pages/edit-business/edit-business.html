<div class="edit-business">
  @if (loading()) {
    <div class="edit-business__loading">
      <app-skeleton variant="line" width="240px" height="40px" />
      <app-skeleton variant="block" height="400px" />
    </div>
  } @else if (profile()) {
    <header class="edit-business__header">
      <div>
        <h1 class="edit-business__title">{{ profile()!.name }}</h1>
        <p class="edit-business__subtitle">Edit your business profile</p>
      </div>
      <app-badge [variant]="profile()!.verificationStatus.toLowerCase()">
        {{ profile()!.verificationStatus }}
      </app-badge>
    </header>

    <div class="edit-business__body">
      <app-card padding="lg">
        <h2 class="edit-business__card-title">Branding</h2>
        <app-branding-upload [profile]="profile()!" />
      </app-card>

      <app-card padding="lg">
        <h2 class="edit-business__card-title">Details</h2>
        <app-business-form
          [existing]="profile()"
          [submitting]="submitting()"
          (submitted)="submit($event)"
          (cancelled)="cancel()"
        />
      </app-card>
    </div>
  }
</div>
