<app-card [hoverable]="true" padding="none" class="biz-card">
  <div
    class="biz-card__banner"
    [style.background-image]="business().bannerUrl ? 'url(' + business().bannerUrl + ')' : null"
    [class.biz-card__banner--empty]="!business().bannerUrl"
  ></div>

  <div class="biz-card__body">
    <div class="biz-card__identity">
      <div class="biz-card__logo" [class.biz-card__logo--empty]="!business().logoUrl">
        @if (business().logoUrl) {
          <img [src]="business().logoUrl" [alt]="business().name" />
        } @else {
          <span class="biz-card__logo-initial">{{ business().name.charAt(0) }}</span>
        }
      </div>
      <div class="biz-card__meta">
        <h3 class="biz-card__name">{{ business().name }}</h3>
        <span class="biz-card__type">{{ typeLabels[business().businessType] }}</span>
      </div>
    </div>

    @if (business().description) {
      <p class="biz-card__description">{{ business().description }}</p>
    }

    <div class="biz-card__footer">
      <div class="biz-card__badges">
        <app-badge [variant]="business().isPublic ? 'public' : 'private'">
          {{ business().isPublic ? 'Public' : 'Private' }}
        </app-badge>
        <app-badge [variant]="business().verificationStatus.toLowerCase()">
          {{ business().verificationStatus }}
        </app-badge>
      </div>
      <a [routerLink]="[business().id, 'edit']" class="biz-card__edit-link">Edit →</a>
    </div>
  </div>
</app-card>
