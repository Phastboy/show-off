<form class="biz-form" [formGroup]="form" (ngSubmit)="submit()">

  <div class="biz-form__section">
    <h2 class="biz-form__section-title">Identity</h2>

    <div class="field" [class.field--error]="isInvalid('name')">
      <label class="field__label" for="name">Business name <span class="field__required">*</span></label>
      <input
        id="name"
        class="field__input"
        type="text"
        formControlName="name"
        placeholder="e.g. Pulse Logistics"
        autocomplete="organization"
      />
      @if (isInvalid('name')) {
        <span class="field__error">Name is required (2–100 characters)</span>
      }
    </div>

    <div class="field" [class.field--error]="isInvalid('businessType')">
      <label class="field__label" for="businessType">Business type <span class="field__required">*</span></label>
      <select id="businessType" class="field__select" formControlName="businessType">
        <option value="" disabled>Select a type</option>
        @for (option of businessTypeOptions; track option[0]) {
          <option [value]="option[0]">{{ option[1] }}</option>
        }
      </select>
      @if (isInvalid('businessType')) {
        <span class="field__error">Please select a business type</span>
      }
    </div>

    <div class="field">
      <label class="field__label" for="description">Description</label>
      <textarea
        id="description"
        class="field__textarea"
        formControlName="description"
        placeholder="Tell people what you offer..."
        rows="4"
      ></textarea>
    </div>
  </div>

  <div class="biz-form__section">
    <h2 class="biz-form__section-title">Contact</h2>
    <p class="biz-form__section-hint">How customers reach you outside Pulse</p>

    <div class="biz-form__row">
      <div class="field">
        <label class="field__label" for="phoneNumber">Phone</label>
        <input id="phoneNumber" class="field__input" type="tel" formControlName="phoneNumber" placeholder="+1 555 000 0000" />
      </div>

      <div class="field">
        <label class="field__label" for="whatsapp">WhatsApp</label>
        <input id="whatsapp" class="field__input" type="tel" formControlName="whatsapp" placeholder="+1 555 000 0000" />
      </div>
    </div>

    <div class="biz-form__row">
      <div class="field" [class.field--error]="isInvalid('email')">
        <label class="field__label" for="email">Email</label>
        <input id="email" class="field__input" type="email" formControlName="email" placeholder="hello@yourbusiness.com" />
        @if (isInvalid('email')) {
          <span class="field__error">Enter a valid email address</span>
        }
      </div>

      <div class="field">
        <label class="field__label" for="location">Location</label>
        <input id="location" class="field__input" type="text" formControlName="location" placeholder="Lagos, Nigeria" />
      </div>
    </div>
  </div>

  <div class="biz-form__section">
    <h2 class="biz-form__section-title">Visibility</h2>

    <label class="toggle">
      <input class="toggle__input" type="checkbox" formControlName="isPublic" />
      <span class="toggle__track">
        <span class="toggle__thumb"></span>
      </span>
      <span class="toggle__label">
        <span class="toggle__label-title">Make this profile public</span>
        <span class="toggle__label-hint">Public profiles appear in discovery and have a shareable storefront page</span>
      </span>
    </label>
  </div>

  <div class="biz-form__actions">
    <button type="button" class="btn btn--ghost" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn btn--primary" [disabled]="submitting()">
      @if (submitting()) {
        <span class="btn__spinner"></span>
        Saving...
      } @else {
        {{ existing() ? 'Save changes' : 'Create business' }}
      }
    </button>
  </div>

</form>
