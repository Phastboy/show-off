<form class="biz-form" [formGroup]="form" (ngSubmit)="submit()">

  <div class="biz-form__section">
    <h2 class="biz-form__section-title">Identity</h2>

    <app-field label="Business name" [required]="true"
      [error]="isInvalid('name') ? getError('name') : null"
      [attr.data-error]="isInvalid('name') || null">
      <input formControlName="name" type="text" placeholder="e.g. Pulse Logistics" autocomplete="organization" />
    </app-field>

    <app-field label="Business type" [required]="true"
      [error]="isInvalid('businessType') ? getError('businessType') : null"
      [attr.data-error]="isInvalid('businessType') || null">
      <select formControlName="businessType">
        <option value="" disabled>Select a type</option>
        @for (opt of businessTypeOptions; track opt[0]) {
          <option [value]="opt[0]">{{ opt[1] }}</option>
        }
      </select>
    </app-field>

    <app-field label="Description" hint="Tell people what you offer">
      <textarea formControlName="description" rows="4" placeholder="Tell people what you offer..."></textarea>
    </app-field>
  </div>

  <div class="biz-form__section">
    <h2 class="biz-form__section-title">Contact</h2>
    <p class="biz-form__section-hint">How customers reach you outside Pulse</p>

    <div class="biz-form__row">
      <app-field label="Phone">
        <input formControlName="phoneNumber" type="tel" placeholder="+1 555 000 0000" />
      </app-field>
      <app-field label="WhatsApp">
        <input formControlName="whatsapp" type="tel" placeholder="+1 555 000 0000" />
      </app-field>
    </div>

    <div class="biz-form__row">
      <app-field label="Email"
        [error]="isInvalid('email') ? getError('email') : null"
        [attr.data-error]="isInvalid('email') || null">
        <input formControlName="email" type="email" placeholder="hello@yourbusiness.com" />
      </app-field>
      <app-field label="Location">
        <input formControlName="location" type="text" placeholder="Lagos, Nigeria" />
      </app-field>
    </div>
  </div>

  <div class="biz-form__section">
    <h2 class="biz-form__section-title">Visibility</h2>

    <label class="toggle">
      <input class="toggle__input" type="checkbox" formControlName="isPublic" />
      <span class="toggle__track"><span class="toggle__thumb"></span></span>
      <span class="toggle__label">
        <span class="toggle__label-title">Make this profile public</span>
        <span class="toggle__label-hint">Public profiles appear in discovery and have a shareable storefront page</span>
      </span>
    </label>
  </div>

  <div class="biz-form__actions">
    <button appBtn variant="ghost" type="button" (click)="cancel()">Cancel</button>
    <button appBtn variant="primary" type="submit" [loading]="submitting()">
      {{ existing() ? 'Save changes' : 'Create business' }}
    </button>
  </div>

</form>
