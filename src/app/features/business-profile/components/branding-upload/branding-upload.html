<div class="branding">

  <div class="branding__banner">
    <div
      class="branding__banner-preview"
      [style.background-image]="profile().bannerUrl ? 'url(' + profile().bannerUrl + ')' : null"
      [class.branding__banner-preview--empty]="!profile().bannerUrl"
    >
      @if (!profile().bannerUrl) {
        <span class="branding__placeholder-text">No banner</span>
      }
    </div>
    <button
      type="button"
      class="branding__upload-btn"
      [disabled]="uploadingBanner()"
      (click)="pickBanner()"
    >
      @if (uploadingBanner()) {
        <span class="spinner"></span>
        Uploading...
      } @else {
        {{ profile().bannerUrl ? 'Replace banner' : 'Upload banner' }}
      }
    </button>
    <p class="branding__hint">PNG, JPG, WebP — recommended 1200×300px</p>
  </div>

  <div class="branding__logo">
    <div
      class="branding__logo-preview"
      [class.branding__logo-preview--empty]="!profile().logoUrl"
    >
      @if (profile().logoUrl) {
        <img [src]="profile().logoUrl" [alt]="profile().name + ' logo'" />
      } @else {
        <span class="branding__logo-initial">{{ profile().name.charAt(0) }}</span>
      }
    </div>
    <div class="branding__logo-actions">
      <p class="branding__logo-label">Logo</p>
      <button
        type="button"
        class="branding__upload-btn"
        [disabled]="uploadingLogo()"
        (click)="pickLogo()"
      >
        @if (uploadingLogo()) {
          <span class="spinner"></span>
          Uploading...
        } @else {
          {{ profile().logoUrl ? 'Replace logo' : 'Upload logo' }}
        }
      </button>
      <p class="branding__hint">PNG, JPG, WebP — recommended 256×256px</p>
    </div>
  </div>

</div>
