<div class="shell">

  <!-- ── Top navbar ───────────────────────────────────────── -->
  <nav class="navbar" aria-label="Main navigation">
    <a class="brand" routerLink="/venues">CampusPulse</a>

    <!-- Desktop nav links (hidden on mobile) -->
    <div class="nav-links" role="list">
      <a role="listitem"
         routerLink="/venues"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         aria-label="Venues">
        <svg lucideHome aria-hidden="true"></svg>
        Venues
      </a>
      <a role="listitem"
         routerLink="/venues/create"
         routerLinkActive="active"
         aria-label="List a Venue">
        <svg lucidePlusSquare aria-hidden="true"></svg>
        List a Venue
      </a>
      <a role="listitem"
         routerLink="/profile"
         routerLinkActive="active"
         aria-label="Profile">
        <svg lucideUser aria-hidden="true"></svg>
        Profile
      </a>
    </div>

    <button class="logout-btn" (click)="logout()" aria-label="Sign out">
      <svg lucideLogOut aria-hidden="true"></svg>
      <span class="logout-label">Sign out</span>
    </button>
  </nav>

  <!-- ── Main content ──────────────────────────────────────── -->
  <main class="shell-main">
    <router-outlet />
  </main>

  <!-- ── Bottom tab bar (mobile only) ─────────────────────── -->
  <nav class="bottom-nav" aria-label="Tab navigation">
    <a routerLink="/venues"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: true }"
       class="tab-item"
       aria-label="Venues">
      <svg lucideHome aria-hidden="true"></svg>
      <span>Venues</span>
    </a>
    <a routerLink="/venues/create"
       routerLinkActive="active"
       class="tab-item tab-create"
       aria-label="List a Venue">
      <div class="tab-create-bubble">
        <svg lucidePlusSquare aria-hidden="true"></svg>
      </div>
      <span>List</span>
    </a>
    <a routerLink="/profile"
       routerLinkActive="active"
       class="tab-item"
       aria-label="Profile">
      <svg lucideUser aria-hidden="true"></svg>
      <span>Profile</span>
    </a>
  </nav>

</div>
